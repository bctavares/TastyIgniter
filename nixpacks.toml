[phases.setup]
nixPkgs = [
    "php84",
    "php84Packages.composer",
    "nginx",
    "libmysqlclient",
    "nodejs_18"
]

[phases.install]
cmds = [
    "composer install --ignore-platform-reqs",
    "npm install",
    "mkdir -p /var/log/nginx /var/cache/nginx"
]

[phases.build]
cmds = [
    "echo 'Skipping frontend build'"
]

[start]
cmd = "sed -i 's|root /app;|root /app/public;|g' /assets/nginx.template.conf && node /assets/scripts/prestart.mjs /assets/nginx.template.conf /nginx.conf && (php-fpm -y /assets/php-fpm.conf & nginx -c /nginx.conf)"
