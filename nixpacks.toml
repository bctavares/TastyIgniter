[phases.setup]
nixPkgs = [
    "php84",
    "php84Packages.composer",
    "nginx",
    "libmysqlclient",
    "nodejs_18"
]

[phases.install]
cmds = [
    "composer install --ignore-platform-reqs",
    "npm install"
]

[phases.build]
cmds = [
    "echo 'Skipping frontend build'"
]

[start]
cmd = "php-FPM -D && nginx -g 'daemon off;'"
